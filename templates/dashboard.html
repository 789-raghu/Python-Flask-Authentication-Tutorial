<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: url('../static/image.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #343a40;
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            opacity: 0.9;
        }
        .header {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .custom-container {
            max-width: 800px;
            margin: 20px auto; /* Center horizontally and add margin to top */
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        .row {
            margin-bottom: 20px; /* Add margin for spacing */
        }
        .navbar {
            margin-bottom: 30px;
            background-color: rgba(255, 255, 255, 0.263); /* Change navbar background color to white */
        }
        .dashboard-heading {
            text-align: center;
            margin-bottom: 30px;
        }
        .custom-btn {
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .custom-btn:hover {
            transform: translateY(-3px) scale(1.05);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 11;
        }
        .overlay {
            display: none; /* Hide overlay by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Background color for overlay */
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .overlay.active {
            display: flex; /* Show overlay when active */
        }
        .overlay-content {
            background: rgba(255, 255, 255, 0.338); /* Change this to solid white for opacity independence */
            backdrop-filter: blur(10px); /* Keep the blur effect */
            border-radius: 10px;
            padding: 20px;
            position: relative;
            width: 80%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }
        .overlay-content h3,
        .overlay-content span,
        .overlay-content label,
        .overlay-content input,
        .overlay-content select {
            color: black; /* Set text color to black */
        }
        .overlay-content .form-control {
            background-color: rgba(255, 255, 255, 0.9); /* Ensure form inputs have a solid background */
        }
        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .overlay-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .minimize-btn, .maximize-btn, .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .minimized {
            display: none; /* Hide content when minimized */
        }
        .dropdown-menu {
            right: 0;
            left: auto; /* Align dropdown to the right */
        }
    </style>
</head>
<body>
    <div class="toast" id="toast" style="display: none;">Hello</div>

    <div class="header">
        <img src="https://via.placeholder.com/50" alt="Logo">
    </div>

    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">
            Dashboard
        </a>
        <div class="ml-auto">
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="profileDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Profile <i class="fas fa-user"></i>
                </button>
                <div class="dropdown-menu" aria-labelledby="profileDropdown">
                    <a class="dropdown-item" href="#" onclick="showOverlay('Manage Account')">Manage Account</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="{{ url_for('logout') }}">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid custom-container" style="background-color: rgba(120, 120, 120, 0.153); margin-top: 80px;">
        <div class="row text-center">
            <div class="col-md-6">
                <label for="fileUpload" class="btn btn-info btn-lg btn-block custom-btn">
                    Upload Data
                    <input type="file" id="fileUpload" name="fileUpload" style="display: none;" onchange="handleFileUpload(event)">
                </label>
                <a href="#" class="btn btn-secondary btn-lg btn-block custom-btn" onclick="showOverlay('Train')">Train the data</a>
            </div>
            <div class="col-md-6">
                <a href="#" class="btn btn-primary btn-lg btn-block custom-btn" onclick="showOverlay('Data Prediction')">Data Prediction</a>
                <a href="#" class="btn btn-danger btn-lg btn-block custom-btn" onclick="showPreviewData()">Preview Data</a>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="overlay-content">
            <div class="overlay-header">
                <h3 id="overlay-text">Overlay Title</h3>
                <div>
                    <button class="minimize-btn" onclick="minimizeOverlay()">🔽</button>
                    <button class="maximize-btn" onclick="maximizeOverlay()">🔼</button>
                    <button class="close-btn" onclick="hideOverlay()">×</button>
                </div>
            </div>
            <span class="username text-center d-block mb-2">Welcome, {{ current_user.username.split('@')[0] }}!</span>
            <form id="dataPredictionForm">
                <div id="predictionInputs" style="display: none;">
                    <div class="form-group">
                        <label for="startDate">Start Date:</label>
                        <input type="month" class="form-control" id="startDate" name="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date:</label>
                        <input type="month" class="form-control" id="endDate" name="endDate" required>
                    </div>
                    <div class="form-group">
                        <label for="element">Element:</label>
                        <select class="form-control" id="element" name="element" required>
                            <option value="aluminium">Aluminium</option>
                            <option value="chromium">Chromium</option>
                            <option value="cobalt">Cobalt</option>
                            <option value="copper">Copper</option>
                            <option value="lead">Lead</option>
                            <option value="nickel">Nickel</option>
                            <option value="zinc">Zinc</option>
                        </select>
                    </div>
                </div>
                <div class="overlay-footer">
                    <button type="button" class="btn btn-danger" onclick="hideOverlay()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        function showOverlay(title) {
            document.getElementById('overlay-text').innerText = title;
            document.getElementById('overlay').classList.add('active');
            document.getElementById('predictionInputs').style.display = title === 'Data Prediction' ? 'block' : 'none';
        }
        function hideOverlay() {
            document.getElementById('overlay').classList.remove('active');
        }
        function minimizeOverlay() {
            document.getElementById('predictionInputs').classList.add('minimized');
        }
        function maximizeOverlay() {
            document.getElementById('predictionInputs').classList.remove('minimized');
        }
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                alert(`File uploaded: ${file.name}`);
            }
        }
        function showPreviewData() {
            alert('Previewing Data');
        }
    </script>
</body>
</html>
